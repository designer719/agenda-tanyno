<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda de demandas · Tanyno</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#E9E9E9">
<meta name="color-scheme" content="light">
<style>
:root{
  --bg:#E9E9E9; --card:#FFFFFF; --soft:#F5F5F5; --line:#E6E6E6;
  --ink:#141414; --ink-2:#4A4A4A; --muted:#8C8C8C; --hl:#A9A9A9;
  --wine:#B32B22; --wine-soft:#F6E4E2;
  --r:18px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}

/* topo */
header{padding:36px 0 0}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{height:22px;width:auto;display:block}
.area{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);text-align:right}
h1{margin:56px 0 0;font-weight:700;font-size:52px;line-height:1;letter-spacing:-.02em}
h1 .l1{display:block}
h1 .hl{display:block;width:min(470px,100%);height:auto;margin-top:12px;fill:var(--hl)}
.upd{display:flex;align-items:center;gap:8px;margin:22px 0 0;font-size:13px;color:var(--ink-2)}
.upd i{width:8px;height:8px;border-radius:50%;background:var(--wine);flex:none}

/* abas */
nav{display:flex;gap:8px;margin:32px 0 0;padding-bottom:4px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{all:unset;cursor:pointer;flex:none;padding:11px 18px;border-radius:999px;border:1px solid #CFCFCF;font-size:13px;font-weight:700;color:var(--ink-2);white-space:nowrap;transition:background .15s,color .15s,border-color .15s}
nav button:hover{border-color:var(--ink-2);color:var(--ink)}
nav button[aria-selected=true]{background:var(--wine);border-color:var(--wine);color:#fff}
nav button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
nav .n{display:inline-block;min-width:20px;margin-left:6px;padding:1px 6px;border-radius:999px;background:rgba(0,0,0,.07);font-size:11px;text-align:center}
nav button[aria-selected=true] .n{background:rgba(255,255,255,.22)}

/* conteúdo */
#view{padding-top:36px;padding-bottom:72px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:40px}
.stat{background:var(--card);border-radius:var(--r);padding:20px 22px}
.stat b{display:block;font-size:40px;line-height:1;font-weight:700;letter-spacing:-.02em}
.stat span{display:block;margin-top:10px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stat.warn b{color:var(--wine)}
h2{margin:0;font-size:26px;font-weight:700;letter-spacing:-.01em}
.lead{margin:6px 0 18px;color:var(--ink-2);font-size:14px;max-width:70ch}
.card{background:var(--card);border-radius:var(--r);overflow:hidden}
table{width:100%;border-collapse:collapse}
thead th{padding:16px 18px 12px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
tbody td{padding:15px 18px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
td.main{font-weight:700;color:var(--ink)}
td.note{color:var(--muted);font-size:13px}
td.c{text-align:center;width:56px}
td.date{white-space:nowrap}
tr.done td{color:#B8B8B8}
tr.done td.main{text-decoration:line-through;text-decoration-color:#C8C8C8}
tr.done .pill{opacity:.55}
tr.late td.date{color:var(--wine);font-weight:700}
.when{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.today td.date{font-weight:700}
.today .when{color:var(--ink)}

.pill{display:inline-block;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.p-Alta{background:var(--wine);color:#fff}
.p-Média{background:#DCDCDC;color:var(--ink)}
.p-Baixa{background:var(--soft);color:var(--muted)}
.s-A_fazer{box-shadow:inset 0 0 0 1px #CFCFCF;color:var(--ink-2)}
.s-Em_andamento{background:var(--ink);color:#fff}
.s-Aguardando{background:var(--wine-soft);color:var(--wine)}
.s-Entregue,.s-Feito{background:var(--soft);color:var(--muted)}
.tag{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--ink-2)}

.check{display:inline-block;position:relative;width:20px;height:20px;border-radius:6px;box-shadow:inset 0 0 0 1.5px #C4C4C4;vertical-align:middle}
.check.on{background:var(--wine);box-shadow:none}
.check.on::after{content:"";position:absolute;left:7px;top:3px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}

.group td{padding:22px 18px 10px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
tbody tr.group:first-child td{padding-top:16px}
.num{font-weight:700;color:var(--muted)}
.me td:first-child{box-shadow:inset 3px 0 0 var(--wine)}
.me .who{color:var(--wine);font-weight:700}
.empty{padding:32px;text-align:center;color:var(--muted);background:var(--card);border-radius:var(--r)}

footer{padding:8px 0 40px}
footer .wrap{display:flex;justify-content:space-between;gap:16px;border-top:1px solid #D6D6D6;padding-top:20px;font-size:12px;color:var(--muted)}

@media (max-width:760px){
  .wrap{padding:0 16px}
  header{padding-top:24px}
  .logo{height:18px}
  .area{font-size:10px;letter-spacing:.14em}
  h1{margin-top:40px;font-size:36px}
  h1 .hl{margin-top:10px}
  nav{margin-right:-16px;padding-right:16px}
  #view{padding-top:28px}
  .stats{grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:32px}
  .stat{padding:16px 18px}
  .stat b{font-size:32px}
  h2{font-size:22px}
  .card{background:none;border-radius:0;overflow:visible}
  table,thead,tbody,tr,td{display:block;width:100%}
  thead{display:none}
  tbody tr{position:relative;background:var(--card);border-radius:14px;margin-bottom:10px;padding:14px 16px}
  tbody td{border:0;padding:3px 0}
  td.main{font-size:16px;padding-right:32px}
  td.c{position:absolute;right:14px;top:14px;width:auto;padding:0}
  td.c.n0{position:static;padding:0 0 2px}
  td[data-l]:not(.main):not(.c)::before{content:attr(data-l);display:inline-block;min-width:96px;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
  td:empty{display:none}
  td.note{padding-top:6px}
  td.note::before{display:block !important;margin-bottom:2px}
  tbody tr.group{background:none;padding:18px 0 6px;margin:0;border-radius:0}
  .group td{padding:0 !important;border:0}
  .me td:first-child{box-shadow:none}
  .me{box-shadow:inset 3px 0 0 var(--wine)}
  footer .wrap{flex-direction:column;gap:4px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>

<script>
const TABS=[["demandas","Demandas"],["digital","Digital"],["site","Rotina do site"],["container","Chegada de container"],["onboarding","Onboarding"],["concluidos","Concluídos"]];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pill=(cls,t)=>t?`<span class="pill ${cls}">${esc(t)}</span>`:"";
const sk=t=>"s-"+String(t).replace(/ /g,"_");
const box=on=>`<span class="check ${on?"on":""}" role="img" aria-label="${on?"Feito":"A fazer"}"></span>`;
const card=(head,body)=>`<div class="card"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table></div>`;
function today(){const d=new Date(new Date().toLocaleString("en-US",{timeZone:"America/Sao_Paulo"}));return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function fmt(v){if(!v)return"";const[d,t]=v.split("T");const[y,m,dd]=d.split("-");return `${dd}/${m}`+(t?` ${t.slice(0,5)}`:"")}
let D;
const R={
 demandas(){
  const t=today(); const open=D.demandas.filter(r=>!r[0]&&r[4]!=="Entregue");
  const pr={Alta:0,"Média":1,Baixa:2,"":3};
  const rows=[...D.demandas].sort((a,b)=>(a[0]-b[0])||((a[3]||"9")>(b[3]||"9")?1:(a[3]||"9")<(b[3]||"9")?-1:0)||(pr[a[2]||""]-pr[b[2]||""]));
  const late=open.filter(r=>r[3]&&r[3].slice(0,10)<t).length, hoje=open.filter(r=>r[3]&&r[3].slice(0,10)===t).length;
  return `<div class="stats">
   <div class="stat"><b>${open.length}</b><span>Em aberto</span></div>
   <div class="stat ${late?"warn":""}"><b>${late}</b><span>Atrasadas</span></div>
   <div class="stat"><b>${hoje}</b><span>Para hoje</span></div>
   <div class="stat"><b>${D.concluidos.length}</b><span>Concluídas</span></div></div>
   <h2>Demandas</h2><p class="lead">Ordenadas por prazo. As riscadas já foram feitas e vão para Concluídos no fim do dia.</p>`+
   card(["Feito","Demanda","Prioridade","Prazo","Status","Observações"],rows.map(r=>{
     const done=r[0]||r[4]==="Entregue"; const d=r[3]?r[3].slice(0,10):""; const lt=!done&&d&&d<t; const hj=!done&&d===t;
     return `<tr class="${done?"done":""} ${lt?"late":""} ${hj?"today":""}"><td class="c" data-l="Feito">${box(done)}</td><td class="main" data-l="Demanda">${esc(r[1])}</td><td data-l="Prioridade">${pill("p-"+r[2],r[2])}</td><td class="date" data-l="Prazo">${fmt(r[3])}${lt?`<span class="when">atrasada</span>`:hj?`<span class="when">hoje</span>`:""}</td><td data-l="Status">${pill(sk(done?"Feito":r[4]),done?"Feito":r[4])}</td><td class="note" data-l="Observações">${esc(r[6])}</td></tr>`}).join(""))},
 digital(){return `<h2>Digital</h2><p class="lead">Tarefas recorrentes de RD Station, Meta Ads e canais digitais.</p>`+
   card(["Feito","Tarefa","Frequência","Quando","Observações"],D.digital.map(r=>`<tr class="${r[0]?"done":""}"><td class="c" data-l="Feito">${box(r[0])}</td><td class="main" data-l="Tarefa">${esc(r[1])}</td><td data-l="Frequência"><span class="tag">${esc(r[2])}</span></td><td data-l="Quando">${esc(r[3])}</td><td class="note" data-l="Observações">${esc(r[4])}</td></tr>`).join(""))},
 site(){let g="";return `<h2>Rotina mensal do site</h2><p class="lead">Até dia 20 a Talita decide · entre dia 20 e dia 1 o Rodrigo produz · dia 1 o Rodrigo publica.</p>`+
   card(["Feito","Atividade","Quando","Quem"],D.site.map(r=>{let h="";if(r[1]!==g){g=r[1];h=`<tr class="group"><td colspan="4">${esc(g)}</td></tr>`}
     return h+`<tr class="${r[0]?"done":""}"><td class="c" data-l="Feito">${box(r[0])}</td><td class="main" data-l="Atividade">${esc(r[4])}</td><td data-l="Quando">${esc(r[2])}</td><td data-l="Quem">${esc(r[3])}</td></tr>`}).join(""))},
 container(){let g="";return `<h2>Chegada de container</h2><p class="lead">Fichas técnicas, fotos e site. As etapas do Rodrigo estão marcadas em vinho.</p>`+
   card(["Nº","Atividade","Responsável"],D.container.map(r=>{let h="";if(r[1]!==g){g=r[1];h=`<tr class="group"><td colspan="3">${esc(g)}</td></tr>`}
     return h+`<tr class="${r[3]==="Rodrigo"?"me":""}"><td class="c n0" data-l="Nº"><span class="num">${esc(r[0])}</span></td><td class="main" data-l="Atividade">${esc(r[2])}</td><td data-l="Responsável"><span class="${r[3]==="Rodrigo"?"who":""}">${esc(r[3])}</span></td></tr>`}).join(""))},
 onboarding(){return `<h2>Onboarding e endomarketing</h2><p class="lead">Materiais para quem entra na Tanyno e datas especiais da equipe.</p>`+
   card(["Material","Tipo","Quando fazer"],D.onboarding.map(r=>`<tr><td class="main" data-l="Material">${esc(r[0])}</td><td data-l="Tipo"><span class="tag">${esc(r[1])}</span></td><td data-l="Quando">${esc(r[2])}</td></tr>`).join(""))},
 concluidos(){return `<h2>Concluídos</h2><p class="lead">Tudo o que já foi entregue.</p>`+(D.concluidos.length?
   card(["Concluído em","Demanda","Prioridade","Prazo"],[...D.concluidos].reverse().map(r=>`<tr><td class="date" data-l="Concluído em">${fmt(r[0])}</td><td class="main" data-l="Demanda">${esc(r[1])}</td><td data-l="Prioridade">${pill("p-"+r[2],r[2])}</td><td class="date" data-l="Prazo">${fmt(r[3])}</td></tr>`).join("")):`<div class="empty">Nada concluído ainda.</div>`)}
};
function count(id){if(id==="demandas")return D.demandas.filter(r=>!r[0]&&r[4]!=="Entregue").length;if(id==="digital"||id==="site")return D[id].filter(r=>!r[0]).length;return D[id].length}
function show(id){document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected",b.dataset.id===id));document.getElementById("view").innerHTML=R[id]();try{history.replaceState(null,"","#"+id)}catch(e){}}
document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(b)show(b.dataset.id)});
fetch("data.json",{cache:"no-store"}).then(r=>r.json()).then(d=>{D=d;
  document.getElementById("tabs").innerHTML=TABS.map(([id,l])=>`<button role="tab" data-id="${id}">${l}<span class="n">${count(id)}</span></button>`).join("");
  const [dt,tm]=d.atualizado.split("T");document.getElementById("upd").textContent=`Atualizado em ${fmt(dt)}/${dt.slice(0,4)} às ${tm}`;
  const h=location.hash.slice(1);show(R[h]?h:"demandas")}).catch(()=>{document.getElementById("view").innerHTML='<div class="empty">Não foi possível carregar os dados.</div>'});
</script>
