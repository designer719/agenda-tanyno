<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda de demandas · Tanyno</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#E9E9E9">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:,">
<style>
:root{
  --bg:#E9E9E9; --card:#FFFFFF; --soft:#F5F5F5; --line:#E6E6E6;
  --ink:#141414; --ink-2:#4A4A4A; --muted:#8C8C8C; --hl:#A9A9A9;
  --wine:#B32B22; --wine-soft:#F6E4E2;
  --main:#F1F1F2; --edge:#DADADA;
  --r:18px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}

/* estrutura: menu lateral fixo + área principal */
.app{display:flex;min-height:100vh}
.side{position:sticky;top:0;flex:none;width:264px;height:100vh;display:flex;flex-direction:column;background:var(--card);border-right:1px solid var(--edge);padding:28px 16px 20px;overflow-y:auto}
.app>.main{flex:1;min-width:0;background:var(--main)}
.mtop,.scrim{display:none}
.logo{height:22px;width:auto;display:block}
.side-top{padding:0 10px}
.area{margin:12px 0 0;font-size:13px;color:var(--muted)}
.side-lbl{margin:36px 10px 10px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
nav{display:flex;flex-direction:column;gap:2px}
.ni{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;width:100%;padding:10px;border-radius:10px;font-size:14.5px;line-height:1.25;color:var(--ink)}
.ni:hover{background:var(--soft)}
.ni:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.ni[aria-current=page]{background:var(--wine-soft);color:var(--wine)}
.ni-ic{flex:none;width:20px;height:20px;display:grid;place-items:center}
.ni-ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ni-t{flex:1;min-width:0}
.ni .n{flex:none;min-width:24px;height:24px;padding:0 7px;border-radius:999px;display:grid;place-items:center;background:#EDEDED;color:var(--ink-2);font-size:12px;font-weight:700}
.ni[aria-current=page] .n{background:var(--wine);color:#fff}
/* tela de entrada: sem login não aparece nada da agenda */
body.trancado .app{display:none}
.porta{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px;background:var(--main)}
.porta[hidden]{display:none}
.porta-c{width:min(420px,100%);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px 28px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.porta-c .logo{height:22px}
.porta-c .area{margin:10px 0 0}
.porta-c h1{margin:28px 0 8px;font-size:22px;line-height:1.2;font-weight:700}
.porta-c p{margin:0 0 18px;color:var(--ink-2);font-size:14px}
.porta-c .fl input{font:inherit;font-size:15px;border:1px solid #CFCFCF;border-radius:10px;padding:10px 12px;width:100%;background:#fff;color:var(--ink)}
.porta-c .btn-pri{width:100%;margin-top:4px}
.porta-c :focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.porta-c .erro{color:var(--wine)}
.side-foot{margin-top:auto;padding:16px 10px 0;border-top:1px solid var(--line)}
.upd{margin:12px 0 0;font-size:12px;color:var(--muted)}

/* conteúdo */
#view{max-width:1240px;margin:0 auto;padding:28px 36px 72px}
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;min-height:44px;margin-bottom:24px}
.tb-t{margin:0 auto 0 0;font-size:28px;line-height:1.15;font-weight:700;letter-spacing:-.015em}
.tb-c{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:28px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.stat b{display:block;font-size:30px;line-height:1.05;font-weight:700;letter-spacing:-.02em}
.stat span{display:block;margin-top:4px;font-size:14px;color:var(--ink-2)}
.stat.warn b{color:var(--wine)}
h2{margin:0;font-size:26px;font-weight:700;letter-spacing:-.01em}
.lead{margin:-12px 0 20px;color:var(--ink-2);font-size:14px;max-width:70ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
table{width:100%;border-collapse:collapse}
thead th{padding:16px 18px 12px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
tbody td{padding:15px 18px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
td.main{font-weight:700;color:var(--ink)}
td.note{color:var(--muted);font-size:13px}
td.c{text-align:center;width:56px}
td.date{white-space:nowrap}
tr.done td{color:#B8B8B8}
tr.done td.main{text-decoration:line-through;text-decoration-color:#C8C8C8}
tr.done .pill{opacity:.55}
tr.late td.date{color:var(--wine);font-weight:700}
.when{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.today td.date{font-weight:700}
.today .when{color:var(--ink)}

.pill{display:inline-block;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.p-Alta{background:var(--wine);color:#fff}
.p-Média{background:#DCDCDC;color:var(--ink)}
.p-Baixa{background:var(--soft);color:var(--muted)}
.s-A_fazer{box-shadow:inset 0 0 0 1px #CFCFCF;color:var(--ink-2)}
.s-Em_andamento{background:var(--ink);color:#fff}
.s-Aguardando{background:var(--wine-soft);color:var(--wine)}
.s-Aprovação{box-shadow:inset 0 0 0 1.5px var(--wine);color:var(--wine)}
.s-Entregue,.s-Feito{background:var(--soft);color:var(--muted)}
.tag{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--ink-2)}

.check{display:inline-block;position:relative;width:20px;height:20px;border-radius:6px;box-shadow:inset 0 0 0 1.5px #C4C4C4;vertical-align:middle}
.check.on{background:var(--wine);box-shadow:none}
.check.on::after{content:"";position:absolute;left:7px;top:3px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}

.group td{padding:22px 18px 10px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
tbody tr.group:first-child td{padding-top:16px}
.num{font-weight:700;color:var(--muted)}
.me td:first-child{box-shadow:inset 3px 0 0 var(--wine)}
.me .who{color:var(--wine);font-weight:700}
.empty{padding:32px;text-align:center;color:var(--muted);background:var(--card);border-radius:var(--r)}


/* ---------- calendário de publicações ---------- */
:root{--oficial:#B32B22;--glass:#4F8A8B;--glass-ink:#3A6F70}
.auth{display:flex;align-items:center;gap:10px;font-size:14px}
.auth:empty{display:none}
.av{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:#fff;font-size:12px;font-weight:700;letter-spacing:.02em}
.auth-who{flex:1;min-width:0;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.auth-b{font:inherit;cursor:pointer;font-size:14px;padding:4px 2px;border:0;background:none;color:var(--muted)}
.auth-b:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.auth-b[data-auth-in]{padding:8px 16px;border:1px solid #CFCFCF;border-radius:999px;font-weight:700;color:var(--ink-2)}
#view button:focus-visible,#view select:focus-visible,.cal-dlg :focus-visible,.auth-b:focus-visible,.menu-b:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn-pri,.btn-sec,.btn-ok,.btn-aj,.btn-del,.mn-b,.mn-hoje,.seg-b,.link,.cd-add,.evchip,.pcard,.dlg-x{font:inherit;cursor:pointer}
.btn-pri{border:0;background:var(--ink);color:#fff;border-radius:10px;padding:0 18px;height:40px;font-size:14px;font-weight:700;white-space:nowrap}
.dlg-in .btn-pri{border-radius:999px;height:auto;padding:11px 18px;font-size:13px}
.btn-sec{border:1px solid #CFCFCF;background:var(--card);color:var(--ink-2);border-radius:999px;padding:10px 16px;font-size:13px;font-weight:700}
.btn-sec:disabled{opacity:.4;cursor:default}
.btn-del{border:1px solid var(--wine);background:var(--card);color:var(--wine);border-radius:999px;padding:10px 16px;font-size:13px;font-weight:700}
.link{border:0;background:none;padding:0;color:var(--wine);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg-b{border:0;background:none;height:32px;padding:0 12px;border-radius:7px;font-size:14px;color:var(--ink)}
.seg-b:hover{background:var(--soft)}
.seg-b[aria-pressed=true]{background:var(--ink);color:#fff}
.seg-b.sb-Oficial[aria-pressed=true]{background:var(--oficial)}
.seg-b.sb-Glass[aria-pressed=true]{background:var(--glass-ink)}
.mes-nav{display:flex;align-items:center;gap:2px}
.mn-b{width:32px;height:40px;border-radius:8px;border:0;background:none;font-size:22px;line-height:1;color:var(--ink)}
.mn-b:hover:not(:disabled){background:#E4E4E6}
.mn-b:disabled{opacity:.3;cursor:default}
.mn-sel{height:40px;border-radius:8px;border:0;background:none;padding:0 6px;font:inherit;font-size:15px;color:var(--ink);text-align:center;-webkit-appearance:none;appearance:none;cursor:pointer}
.mn-sel:hover{background:#E4E4E6}
.mn-hoje{height:40px;border-radius:10px;border:1px solid #C9C9C9;background:var(--card);padding:0 16px;font-size:14px;color:var(--ink)}
.mn-hoje:hover{border-color:var(--ink-2)}
.stats.cal-stats{margin-bottom:24px}
.cal-stats .st-ok b{color:#1D6B45}
.cal-stats .st-aj b{color:#A8650A}
.cal-aviso{margin:-8px 0 20px;padding:10px 14px;border-radius:10px;background:#F7F7F7;border:1px dashed #C9C9C9;color:var(--ink-2);font-size:13px}
.cal-dias{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));margin-bottom:8px}
.cg-h{text-align:center;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cd{background:var(--card);min-height:112px;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.cd.fora{background:#F7F7F8}
.cd.passado .cd-n{color:var(--muted)}
.cd.hoje{background:var(--wine-soft)}
.cd.hoje .cd-n{background:var(--wine);color:#fff}
.cd-top{display:flex;align-items:center;justify-content:flex-end;gap:6px;min-height:28px}
.cd-n{display:inline-grid;place-items:center;min-width:28px;height:28px;padding:0 4px;border-radius:50%;font-size:15px}
.cd-c{font-size:11px;color:var(--muted);font-weight:700}
.cd-add{margin-right:auto;flex:none;width:26px;height:26px;border-radius:50%;border:1px solid #CFCFCF;background:var(--card);color:var(--ink-2);font-size:16px;line-height:1;padding:0;opacity:0;transition:opacity .15s}
.cd:hover .cd-add,.cd-add:focus-visible{opacity:1}
@media (hover:none){.cd-add{opacity:1}}
.evchip{display:flex;align-items:center;gap:6px;width:100%;border:0;border-radius:6px;background:#ECECEE;padding:4px 8px;font-size:12px;color:var(--ink);text-align:left}
.evchip:hover{background:#E2E2E4}
.evchip-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.anchip{font:inherit;cursor:pointer;display:flex;align-items:center;gap:6px;width:100%;border:0;border-radius:6px;background:#FDEBD7;padding:4px 8px;font-size:12px;color:#7A4510;text-align:left}
.anchip:hover{background:#FADDBE}
.anchip{align-items:flex-start;line-height:1.3}
.anchip .evchip-t{white-space:normal;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.emchip{font:inherit;cursor:pointer;display:flex;align-items:flex-start;gap:6px;width:100%;border:0;border-radius:6px;background:#E3ECF5;padding:4px 8px;font-size:12px;line-height:1.3;color:#1F4E79;text-align:left}
.emchip:hover{background:#D2E1F0}
.em-t{display:flex;flex-direction:column;min-width:0;overflow-wrap:anywhere}
.em-t b{font-weight:700}
.em-l{font-size:11px;opacity:.85}
.emtag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:#E3ECF5;color:#1F4E79}
.antag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:#FDEBD7;color:#7A4510}
.pcard{display:flex;flex-direction:column;align-items:flex-start;gap:4px;width:100%;text-align:left;border:1px solid var(--line);border-left:3px solid var(--oficial);border-radius:6px;background:var(--card);padding:7px 8px;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.05);transition:box-shadow .15s}
.pcard.c-Glass{border-left-color:var(--glass)}
.pcard:hover{box-shadow:0 2px 10px rgba(0,0,0,.1)}
.pc-top{font-size:12px;line-height:1.3;color:var(--ink)}
.pc-conta{color:var(--oficial)}
.pc-conta.c-Glass{color:var(--glass-ink)}
.ctag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:700;letter-spacing:.03em;color:#fff;background:var(--oficial);white-space:nowrap}
.ctag.c-Glass{background:var(--glass-ink)}
.ctag.c-Ambas{background:var(--ink)}
.ctag.c-Interno{background:#DCDCDC;color:var(--ink)}
.pc-fmt{font-size:11px;font-weight:700;color:var(--ink-2)}
.pc-tema{font-size:12.5px;font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc-bot{display:flex;flex-wrap:wrap;gap:4px}
.stp,.selo{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:700;white-space:nowrap}
.stp{background:#EFEFEF;color:#5E5E5E}
.st-Produzindo{background:#FBEFD5;color:#8A5A00}
.st-Pronto{background:#E2ECF7;color:#1F5A96}
.st-Aprovado{background:#DCEFE4;color:#1D6B45}
.st-Agendado{background:#ECE5F7;color:#5B3A99}
.st-Publicado{background:#1D6B45;color:#fff}
.s-ok{background:#DCEFE4;color:#1D6B45}
.s-aj{background:#FBEFD5;color:#8A5A00}
.s-wait{background:#F3F3F3;color:#6B6B6B}
.cal-lista{display:none}
.ld{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;display:flex;flex-direction:column;gap:8px}
.ld.hoje{box-shadow:inset 0 0 0 2px var(--wine)}
.ld-h{display:flex;align-items:center;gap:8px}
.ld-d{font-weight:700;font-size:15px}
.ld-hoje{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--wine);padding:2px 8px;border-radius:999px}
.ld .cd-add{margin:0 0 0 auto;opacity:1;width:32px;height:32px}
.ld .pc-tema{font-size:14px;-webkit-line-clamp:3}
.ld .evchip,.ld .anchip,.ld .emchip{font-size:13px;padding:7px 10px}
.ld .pcard{padding:10px 12px}
dialog.cal-dlg{border:0;padding:0;border-radius:20px;width:min(640px,calc(100vw - 32px));max-height:calc(100vh - 48px);overflow:auto;background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog.cal-dlg::backdrop{background:rgba(20,20,20,.45)}
.dlg-in{padding:22px 24px 24px}
.dlg-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.dlg-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dlg-data{font-size:13px;font-weight:700;color:var(--ink-2)}
.dlg-x{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:var(--soft);font-size:15px;color:var(--ink)}
.dlg-t{margin:0 0 10px;font-size:22px;font-weight:700;line-height:1.2}
.dlg-h .dlg-t{margin:0}
.dlg-tags{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.dlg-tags .pc-fmt{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--soft)}
.dlg-tags .stp,.dlg-tags .ctag{font-size:12px;padding:3px 10px}
.dlg-dl{margin:0 0 18px;display:grid;gap:12px}
.dl-i dt{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.dl-i dd{margin:0;font-size:14.5px}
.apr{border-top:1px solid var(--line);padding-top:16px}
.apr h4,.hist h4{margin:0 0 12px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.apr h4 .selo{font-size:12px;letter-spacing:0;text-transform:none}
.apr-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-ok,.btn-aj{border:0;border-radius:14px;padding:16px 12px;font-size:15px;font-weight:700;color:#fff}
.btn-ok{background:#1D7A4C}
.btn-aj{background:#A8650A}
.btn-ok:disabled,.btn-aj:disabled{opacity:.35;cursor:not-allowed}
.apr-login{margin:10px 0 0;font-size:13px}
.apr-form{margin-top:14px;display:grid;gap:8px}
.apr-form[hidden]{display:none}
.apr-form label{font-weight:700;font-size:13px}
.apr-form .btn-aj{padding:11px 18px;font-size:13px;border-radius:999px}
.cal-dlg textarea,.cal-dlg input,.cal-dlg select{font:inherit;font-size:15px;border:1px solid #CFCFCF;border-radius:10px;padding:10px 12px;background:#fff;color:var(--ink);width:100%}
.hist{margin-top:18px}
.hist ol{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.hist li{font-size:13.5px;background:var(--soft);border-radius:12px;padding:10px 12px}
.hist li p{margin:6px 0 0;color:var(--ink);white-space:pre-wrap}
.dlg-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line);font-size:13px}
.muted{color:var(--muted)}
.small{font-size:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fl{display:grid;gap:6px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin-bottom:12px}
.fl input,.fl select,.fl textarea{text-transform:none;letter-spacing:0;font-weight:400}
.fl small{font-size:12px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--muted)}
.pre{white-space:pre-wrap;overflow-wrap:anywhere}
.pre a{color:var(--wine)}
.sols{margin:0 0 28px}
.sols h2{font-size:16px;margin:0}
.sols .lead{margin:4px 0 12px}
.sol-l{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.sol{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--wine);border-radius:8px;padding:12px 14px}
.sol-b{font:inherit;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px;border:0;background:none;padding:0;color:var(--ink)}
.sol-b:hover b{text-decoration:underline;text-underline-offset:3px}
.sol-b b{font-size:14.5px;line-height:1.3}
.sol-b span{font-size:12.5px;color:var(--ink-2)}
.sol-a{display:flex;gap:8px}
.sol-a button{flex:1;padding:8px 12px}
.btn-ac{font:inherit;cursor:pointer;border:0;border-radius:999px;background:#1D7A4C;color:#fff;font-size:13px;font-weight:700}
.btn-ac:hover{background:#17663F}
.sol-st{font-size:12px;font-weight:700;color:var(--muted)}
.sol-st.ok{color:#1D6B45}
.dem-b{font:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:left;font-weight:700;color:var(--ink)}
.dem-b:hover{text-decoration:underline;text-underline-offset:3px}
tr.done .dem-b{color:#B8B8B8;text-decoration:line-through;text-decoration-color:#C8C8C8}
.chk-b{font:inherit;cursor:pointer;border:0;background:none;padding:4px;border-radius:8px;line-height:0}
.chk-b:hover .check{box-shadow:inset 0 0 0 1.5px var(--wine)}
select.ed,input.ed{font:inherit;font-size:13px;border:1px solid #D6D6D6;border-radius:8px;padding:5px 8px;background:#fff;color:var(--ink);max-width:100%}
select.ed:hover,input.ed:hover{border-color:var(--ink-2)}
select.ed:focus-visible,input.ed:focus-visible,.dem-b:focus-visible,.chk-b:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.acoes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.acoes button{padding:12px 10px;font-size:14px}
.det{font:inherit;cursor:pointer;display:inline-block;margin-left:8px;padding:2px 9px;border:1px solid #CFCFCF;border-radius:999px;background:var(--card);font-size:11.5px;font-weight:700;color:var(--ink-2);vertical-align:1px}
.det:hover{border-color:var(--ink-2);color:var(--ink)}
.form-msg{font-size:13px;color:var(--ink-2);margin:10px 0 0}
.form-msg:empty{display:none}
.ev-ic{font-size:22px}
.ev-desc{font-size:15px;margin:0 0 12px;white-space:pre-wrap}
@media (max-width:719.98px){
  /* menu lateral vira gaveta */
  .app{display:block}
  .side{position:fixed;left:0;top:0;z-index:40;height:100vh;height:100dvh;width:min(300px,86vw);transform:translateX(-100%);visibility:hidden;transition:transform .2s ease,visibility .2s;box-shadow:0 0 40px rgba(0,0,0,.2)}
  body.menu-aberto .side{transform:none;visibility:visible}
  body.menu-aberto .scrim{display:block;position:fixed;inset:0;z-index:30;background:rgba(20,20,20,.4)}
  body.menu-aberto{overflow:hidden}
  .mtop{display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--edge)}
  .mtop .logo{height:16px}
  .menu-b{font:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border:1px solid #CFCFCF;border-radius:10px;background:var(--card);color:var(--ink);font-size:14px;font-weight:700}
  .menu-b::before{content:"";width:16px;height:10px;border-top:2px solid currentColor;border-bottom:2px solid currentColor;background:linear-gradient(currentColor,currentColor) center/100% 2px no-repeat}
  #view{padding:20px 16px 56px}
  .topbar{gap:12px;margin-bottom:18px}
  .tb-t{font-size:24px;width:100%}
  .tb-c{width:100%}
  .cal-grid,.cal-dias{display:none}
  .cal-lista{display:block}
  .seg{display:flex;width:100%}
  .seg-b{flex:1;padding:0 4px;font-size:13px}
  .mes-nav{flex:1;min-width:0}
  .mn-sel{flex:1;min-width:0}
  .tb-c .btn-pri{width:100%}
  .dlg-in{padding:18px}
  dialog.cal-dlg{width:calc(100vw - 16px);max-height:calc(100vh - 16px);border-radius:16px}
  .row2{grid-template-columns:1fr}
}

@media (max-width:760px){
  .stats{grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:24px}
  .stat b{font-size:26px}
  h2{font-size:22px}
  .card{background:none;border:0;border-radius:0;overflow:visible}
  table,thead,tbody,tr,td{display:block;width:100%}
  thead{display:none}
  tbody tr{position:relative;background:var(--card);border-radius:14px;margin-bottom:10px;padding:14px 16px}
  tbody td{border:0;padding:3px 0}
  td.main{font-size:16px;padding-right:32px}
  td.c{position:absolute;right:14px;top:14px;width:auto;padding:0}
  td.c.n0{position:static;padding:0 0 2px}
  td[data-l]:not(.main):not(.c)::before{content:attr(data-l);display:inline-block;min-width:96px;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
  td:empty{display:none}
  td.note{padding-top:6px}
  td.note::before{display:block !important;margin-bottom:2px}
  tbody tr.group{background:none;padding:18px 0 6px;margin:0;border-radius:0}
  .group td{padding:0 !important;border:0}
  .me td:first-child{box-shadow:none}
  .me{box-shadow:inset 3px 0 0 var(--wine)}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>

const TABS=[["calendario","Calendário de publicações"],["demandas","Demandas"],["digital","Digital"],["site","Rotina do site"],["container","Chegada de container"],["onboarding","Onboarding"],["concluidos","Concluídos"]];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pill=(cls,t)=>t?`<span class="pill ${cls}">${esc(t)}</span>`:"";
const sk=t=>"s-"+String(t).replace(/ /g,"_");
const box=on=>`<span class="check ${on?"on":""}" role="img" aria-label="${on?"Feito":"A fazer"}"></span>`;
const barra=(t,c="")=>`<div class="topbar"><h1 class="tb-t">${t}</h1>${c}</div>`;
const card=(head,body)=>`<div class="card"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table></div>`;
function today(){const d=new Date(new Date().toLocaleString("en-US",{timeZone:"America/Sao_Paulo"}));return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function fmt(v){if(!v)return"";const[d,t]=v.split("T");const[y,m,dd]=d.split("-");return `${dd}/${m}`+(t?` ${t.slice(0,5)}`:"")}
let D=null;
// aceita pelo site que a rotina ainda não pôs na planilha: já aparece como demanda normal (mesmo texto que a rotina grava)
const CRONO_SOL={"Tanyno":"Tanyno Oficial","Tanyno Glass":"Tanyno Glass"},POST_SOL=["Card feed","Reels","Carrossel","Stories"];
function obsSol(s){let o=`Pedido pelo site: ${s.tipo}, ${s.marca}. Briefing completo no site.`;
  if(s.data_publicacao&&CRONO_SOL[s.marca]&&POST_SOL.includes(s.tipo)){const d=String(s.data_publicacao).slice(0,10);o+=` Publicação em ${d.slice(8,10)}/${d.slice(5,7)}/${d.slice(0,4)} (${CRONO_SOL[s.marca]}).`}return o}
// edições do site ainda não aplicadas na planilha aparecem por cima (a mais nova vale); r.linha e r.orig identificam a linha
const EDCOL={feito:0,demanda:1,prioridade:2,prazo:3,status:4,observacoes:6};
function demandasTodas(){const eds=Calendario.edicoes();
  const base=D.demandas.map(r0=>{const r=r0.slice(0,7);r.linha=r0[7];r.orig=r0[1];
    for(const e of eds)if(e.linha===r.linha&&e.demanda===r.orig){if(e.campo==="excluir")r.excluida=true;else r[EDCOL[e.campo]]=e.campo==="feito"?e.valor==="true":e.valor}
    return r}).filter(r=>!r.excluida);
  return base.concat(Calendario.solicitacoes().filter(s=>s.situacao==="aceita"&&!s.na_planilha&&!D.demandas.some(r=>r[1]===s.titulo&&r[5]===s.criado_por))
  .map(s=>{const r=[false,s.titulo,s.urgencia||"Média",String(s.prazo).slice(0,10),"A fazer",s.criado_por||"",obsSol(s)];r.sol=s;return r}))}
let LINHAS=[];   // linhas desenhadas na tabela (os botões apontam pelo índice)
const sel=(campo,i,lista,v,vazio)=>`<select class="ed" data-ed="${campo}" data-i="${i}" aria-label="${campo==="prioridade"?"Prioridade":"Status"}">${!v&&vazio?`<option value="" selected disabled>${vazio}</option>`:""}${v&&!lista.includes(v)?`<option selected>${esc(v)}</option>`:""}${lista.map(x=>`<option${x===v?" selected":""}>${esc(x)}</option>`).join("")}</select>`;
const R={
 demandas(){
  const t=today(),todas=demandasTodas(); const open=todas.filter(r=>!r[0]&&r[4]!=="Entregue");
  const pr={Alta:0,"Média":1,Baixa:2,"":3};
  const rows=[...todas].sort((a,b)=>(a[0]-b[0])||((a[3]||"9")>(b[3]||"9")?1:(a[3]||"9")<(b[3]||"9")?-1:0)||(pr[a[2]||""]-pr[b[2]||""]));
  const late=open.filter(r=>r[3]&&r[3].slice(0,10)<t).length, hoje=open.filter(r=>r[3]&&r[3].slice(0,10)===t).length;
  // demanda pedida pelo site = mesma Demanda e mesmo Pedido por na planilha
  const sols=Calendario.solicitacoes(), solDe=r=>r.sol||sols.find(s=>s.titulo===(r.orig||r[1])&&s.criado_por===r[5]);
  // só as novas: aceita vira demanda normal na tabela, recusada some
  const pend=sols.filter(s=>(s.situacao||"pendente")==="pendente");
  const gestor=Calendario.podeAceitar();
  const acao=s=>gestor?`<div class="sol-a"><button type="button" class="btn-ac" data-aceitar="${esc(s.id)}">Aceitar</button><button type="button" class="btn-sec" data-recusar="${esc(s.id)}">Recusar</button></div>`
    :`<span class="sol-st">Aguardando o Rodrigo aceitar</span>`;
  const bt=Calendario.store.mode!=="off"?`<div class="tb-c"><button type="button" class="btn-pri" data-nova-demanda>+ Nova demanda</button></div>`:"";
  return barra("Demandas",bt)+`<div class="stats">
   <div class="stat"><b>${open.length}</b><span>Em aberto</span></div>
   <div class="stat ${late?"warn":""}"><b>${late}</b><span>Atrasadas</span></div>
   <div class="stat"><b>${hoje}</b><span>Para hoje</span></div>
   <div class="stat"><b>${D.concluidos.length}</b><span>Concluídas</span></div></div>
   ${pend.length?`<section class="sols" aria-labelledby="sols-t"><h2 id="sols-t">Enviadas pelo site</h2><p class="lead">Novas, aguardando aceite. A aceita vai na hora para as demandas abaixo; se for publicação, entra no cronograma na próxima atualização automática.</p><div class="sol-l">${pend.map(s=>`<div class="sol"><button type="button" class="sol-b" data-sol="${esc(s.id)}"><b>${esc(s.titulo)}</b><span>${esc(s.tipo)} · ${esc(s.marca)} · prazo ${fmt(String(s.prazo).slice(0,10))}</span><span>Pedido por ${esc(s.criado_por)}</span></button>${acao(s)}</div>`).join("")}</div></section>`:""}
   <p class="lead">Ordenadas por prazo. As riscadas já foram feitas e vão para Concluídos no fim do dia.</p>`+
   card(["Feito","Demanda","Prioridade","Prazo","Status","Observações"],(LINHAS=rows).map((r,i)=>{
     r.sol=solDe(r);
     const done=r[0]||r[4]==="Entregue"; const d=r[3]?r[3].slice(0,10):""; const lt=!done&&d&&d<t; const hj=!done&&d===t;
     const ed=gestor&&r.linha;   // só linhas que já estão na planilha, e só para quem decide
     const feito=ed?`<button type="button" class="chk-b" data-acoes="${i}" aria-label="Concluir, editar ou excluir: ${esc(r[1])}">${box(r[0])}</button>`:box(done);
     const pri=ed?sel("prioridade",i,["Alta","Média","Baixa"],r[2],"Definir"):pill("p-"+r[2],r[2]);
     const prazo=ed?`<input type="date" class="ed" data-ed="prazo" data-i="${i}" value="${esc(d)}" aria-label="Prazo">`:fmt(r[3]);
     const st=ed?sel("status",i,["A fazer","Em andamento","Aprovação","Aguardando","Entregue"],r[4]||"A fazer"):pill(sk(done?"Feito":r[4]),done?"Feito":r[4]);
     return `<tr class="${done?"done":""} ${lt?"late":""} ${hj?"today":""}"><td class="c" data-l="Feito">${feito}</td><td class="main" data-l="Demanda"><button type="button" class="dem-b" data-ver="${i}">${esc(r[1])}</button></td><td data-l="Prioridade">${pri}</td><td class="date" data-l="Prazo">${prazo}${lt?`<span class="when">atrasada</span>`:hj?`<span class="when">hoje</span>`:""}</td><td data-l="Status">${st}</td><td class="note" data-l="Observações">${esc(r[6])}</td></tr>`}).join(""))},
 digital(){return barra("Digital")+`<p class="lead">Tarefas recorrentes de RD Station, Meta Ads e canais digitais.</p>`+
   card(["Feito","Tarefa","Frequência","Quando","Observações"],D.digital.map(r=>`<tr class="${r[0]?"done":""}"><td class="c" data-l="Feito">${box(r[0])}</td><td class="main" data-l="Tarefa">${esc(r[1])}</td><td data-l="Frequência"><span class="tag">${esc(r[2])}</span></td><td data-l="Quando">${esc(r[3])}</td><td class="note" data-l="Observações">${esc(r[4])}</td></tr>`).join(""))},
 site(){let g="";return barra("Rotina mensal do site")+`<p class="lead">Até dia 20 a Talita decide · entre dia 20 e dia 1 o Rodrigo produz · dia 1 o Rodrigo publica.</p>`+
   card(["Feito","Atividade","Quando","Quem"],D.site.map(r=>{let h="";if(r[1]!==g){g=r[1];h=`<tr class="group"><td colspan="4">${esc(g)}</td></tr>`}
     return h+`<tr class="${r[0]?"done":""}"><td class="c" data-l="Feito">${box(r[0])}</td><td class="main" data-l="Atividade">${esc(r[4])}</td><td data-l="Quando">${esc(r[2])}</td><td data-l="Quem">${esc(r[3])}</td></tr>`}).join(""))},
 container(){let g="";return barra("Chegada de container")+`<p class="lead">Fichas técnicas, fotos e site. As etapas do Rodrigo estão marcadas em vinho.</p>`+
   card(["Nº","Atividade","Responsável"],D.container.map(r=>{let h="";if(r[1]!==g){g=r[1];h=`<tr class="group"><td colspan="3">${esc(g)}</td></tr>`}
     return h+`<tr class="${r[3]==="Rodrigo"?"me":""}"><td class="c n0" data-l="Nº"><span class="num">${esc(r[0])}</span></td><td class="main" data-l="Atividade">${esc(r[2])}</td><td data-l="Responsável"><span class="${r[3]==="Rodrigo"?"who":""}">${esc(r[3])}</span></td></tr>`}).join(""))},
 onboarding(){return barra("Onboarding e endomarketing")+`<p class="lead">Materiais para quem entra na Tanyno e datas especiais da equipe.</p>`+
   card(["Material","Tipo","Quando fazer"],D.onboarding.map(r=>`<tr><td class="main" data-l="Material">${esc(r[0])}</td><td data-l="Tipo"><span class="tag">${esc(r[1])}</span></td><td data-l="Quando">${esc(r[2])}</td></tr>`).join(""))},
 concluidos(){return barra("Concluídos")+`<p class="lead">Tudo o que já foi entregue.</p>`+(D.concluidos.length?
   card(["Concluído em","Demanda","Prioridade","Prazo"],[...D.concluidos].reverse().map(r=>`<tr><td class="date" data-l="Concluído em">${fmt(r[0])}</td><td class="main" data-l="Demanda">${esc(r[1])}</td><td data-l="Prioridade">${pill("p-"+r[2],r[2])}</td><td class="date" data-l="Prazo">${fmt(r[3])}</td></tr>`).join("")):`<div class="empty">Nada concluído ainda.</div>`)}
};
let CUR=null;
const LOGIN_NA_URL=()=>/access_token|error_description/.test(location.hash);
const HASH0=LOGIN_NA_URL()?"":location.hash.slice(1);
// porta: "entrar" (sem login), "sem-acesso" (e-mail fora da lista), "fora" (Supabase fora do ar) ou null (agenda aberta)
function porta(tipo){const p=document.getElementById("porta"),st=Calendario.store,logo=document.querySelector(".side .logo").src;
  document.body.classList.toggle("trancado",!!tipo);p.hidden=!tipo;if(!tipo){p.innerHTML="";return}
  const cab=`<img class="logo" src="${logo}" alt="Tanyno"><p class="area">Marketing e design</p><h1>Agenda de demandas</h1>`;
  if(tipo==="entrar")p.innerHTML=`<div class="porta-c">${cab}
    <p>Entre com o e-mail e a senha que você recebeu do Rodrigo.</p>
    <form id="porta-f"><label class="fl">E-mail<input type="email" name="email" required autocomplete="username"></label>
    <label class="fl">Senha<input type="password" name="senha" required autocomplete="current-password"></label>
    <button type="submit" class="btn-pri">Entrar</button><p class="form-msg" role="status"></p>
    <p class="small muted">Esqueceu a senha? Fale com o Rodrigo.</p></form></div>`;
  else if(tipo==="sem-acesso")p.innerHTML=`<div class="porta-c">${cab}<p>Você entrou como <b>${esc(st.user.email)}</b>, mas este e-mail não tem acesso à agenda. Fale com o Rodrigo.</p>
    <button type="button" class="btn-sec" data-porta-sair>Sair</button></div>`;
  else p.innerHTML=`<div class="porta-c">${cab}<p>A agenda está indisponível no momento. Tente de novo em alguns minutos.</p></div>`}
document.getElementById("porta").addEventListener("submit",async e=>{e.preventDefault();const f=e.target,msg=f.querySelector(".form-msg"),b=f.querySelector("button");
  b.disabled=true;msg.textContent="Entrando…";
  try{await Calendario.entrar(f.email.value.trim(),f.senha.value)}
  catch(err){msg.textContent=err.message||String(err);f.senha.value="";b.disabled=false;f.senha.focus()}});
document.getElementById("porta").addEventListener("click",e=>{if(e.target.closest("[data-porta-sair]"))Calendario.sair()});
let abrindo=false;
async function abreAgenda(){const st=Calendario.store;
  if(st.mode==="off")return porta("fora");
  if(!st.user)return porta("entrar");
  if(!st.user.permitido)return porta("sem-acesso");
  if(D)return porta(null);
  if(abrindo)return;abrindo=true;
  try{const d=await Calendario.carregaAgenda();D=d;Calendario.init(d.instagram||[],d.aniversarios||[],d.empresa||[]);
    const [dt,tm]=d.atualizado.split("T");document.getElementById("upd").textContent=`Atualizado ${fmt(dt)} às ${tm}`;
    porta(null);let h=HASH0;if(!R[h]&&h!=="calendario")h="calendario";CUR=h;renderTabs();show(h)}
  catch(e){console.error(e);porta("fora")}
  finally{abrindo=false}}
function fechaAgenda(){D=null;CUR=null;Calendario.unmount();document.getElementById("view").innerHTML="";document.getElementById("tabs").innerHTML=""}
function count(id){if(id==="calendario"){const n=Calendario.pendentes();return n==null?"":n}if(id==="demandas")return demandasTodas().filter(r=>!r[0]&&r[4]!=="Entregue").length;if(id==="digital"||id==="site")return D[id].filter(r=>!r[0]).length;return D[id].length}
function renderTabs(){document.getElementById("tabs").innerHTML=TABS.map(([id,l])=>{const n=count(id),cal=id==="calendario";
  return `<button type="button" class="ni" data-id="${id}"${id===CUR?' aria-current="page"':""}><span class="ni-ic" aria-hidden="true">${ICO[id]||""}</span><span class="ni-t">${l}</span>${n===""?"":`<span class="n"${cal?` title="Posts aguardando aprovação" aria-label="${n} aguardando aprovação"`:""}>${n}</span>`}</button>`}).join("")}
function show(id){CUR=id;document.querySelectorAll(".ni").forEach(b=>b.dataset.id===id?b.setAttribute("aria-current","page"):b.removeAttribute("aria-current"));const v=document.getElementById("view");
  if(id==="calendario")Calendario.mount(v);else{Calendario.unmount();v.innerHTML=R[id]()}
  if(!LOGIN_NA_URL()){try{history.replaceState(null,"","#"+id)}catch(e){}}}
document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(b){show(b.dataset.id);menu(false)}});
// gaveta do celular (abaixo de 720px o menu lateral fica escondido)
const menuB=document.getElementById("menu-b");
function menu(abrir,focoNoBotao){if(document.body.classList.contains("menu-aberto")===abrir)return;
  document.body.classList.toggle("menu-aberto",abrir);menuB.setAttribute("aria-expanded",abrir);document.querySelector(".app>.main").inert=abrir;
  if(abrir){const a=document.querySelector(".ni[aria-current]")||document.querySelector(".ni");if(a)setTimeout(()=>a.focus(),50)}else if(focoNoBotao)menuB.focus()}
menuB.addEventListener("click",()=>menu(true));
document.getElementById("scrim").addEventListener("click",()=>menu(false,true));
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&document.body.classList.contains("menu-aberto"))menu(false,true)});
document.getElementById("view").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  if(b.hasAttribute("data-nova-demanda"))Calendario.novaDemanda();else if(b.dataset.sol)Calendario.verSolicitacao(b.dataset.sol);
  else if(b.dataset.aceitar)Calendario.aceitarDemanda(b.dataset.aceitar);else if(b.dataset.recusar)Calendario.recusarDemanda(b.dataset.recusar);
  else if(b.dataset.ver)Calendario.verDemanda(LINHAS[+b.dataset.ver]);else if(b.dataset.acoes)Calendario.acoesDemanda(LINHAS[+b.dataset.acoes])});
document.getElementById("view").addEventListener("change",e=>{const c=e.target.closest("[data-ed]");if(!c||!c.value)return;
  const r=LINHAS[+c.dataset.i];if(r)Calendario.editaCampo(r,c.dataset.ed,c.value)});
Calendario.onUpdate=()=>{const u=Calendario.store.user;
  if(!u||!u.permitido){if(D)fechaAgenda();abreAgenda();return}
  if(!D){abreAgenda();return}
  renderTabs();if(CUR==="demandas")show(CUR)};
Calendario.start().then(()=>{if(LOGIN_NA_URL()){try{history.replaceState(null,"",location.pathname+location.search+"#calendario")}catch(e){}}abreAgenda()});
</script>
</body>
</html>
